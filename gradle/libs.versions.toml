# Catálogo de versiones: equivalente a centralizar versiones de NuGet en Directory.Packages.props.
[versions]
agp = "9.5.0"
# Media3 se fija en 1.9.x porque el decodificador FFmpeg de Jellyfin (que se añade en la Fase 2)
# solo está publicado hasta 1.9.0+1 y debe coincidir con la versión mayor/menor de Media3.
media3 = "1.9.4"
coreKtx = "1.19.1"
activity = "1.13.0"
# Debe ir a juego con media3 (1.9.x). El sufijo "+1" es la revisión de Jellyfin.
ffmpegDecoder = "1.9.0+1"
datastore = "1.3.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
jellyfin-media3-ffmpeg = { group = "org.jellyfin.media3", name = "media3-ffmpeg-decoder", version.ref = "ffmpegDecoder" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
